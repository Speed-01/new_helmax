name: Django CI
on: [push]

jobs:
  test:
    runs-on: self-hosted 
    # This gives the runner explicit permission to read the repo
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # This fixes the most common 'Permission Denied' error in containers
          set-safe-directory: 'false'

      - name: Debug Check
        # This tells us if 'git' and 'python' are actually installed
        run: |
          git --version
          python3 --version

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Django Tests
        run: python3 manage.py test
