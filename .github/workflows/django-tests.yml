name: Django CI
on: [push]

jobs:
  test:
    runs-on: self-hosted 
    
    # Required for private runners to access repository contents safely
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # Fixes ownership errors in containerized environments
          set-safe-directory: 'false'

      - name: Use System Python
        # Instead of 'actions/setup-python', we use the Python already in the container
        run: |
          python3 --version
          pip3 --version

      - name: Install Dependencies
        run: |
          # Use --user to avoid 'Permission Denied' errors in the container
          # and ensure requirements.txt exists before running
          if [ -f requirements.txt ]; then
            python3 -m pip install --user --upgrade pip
            python3 -m pip install --user -r requirements.txt
          else
            echo "requirements.txt not found"
            exit 1
          fi

      - name: Run Django Tests
        run: |
          # Ensure the local bin is in PATH for Django commands
          export PATH=$PATH:~/.local/bin
          python3 manage.py test
